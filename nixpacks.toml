[phases.setup]
nixPkgs = ["nodejs_20", "python312", "python312Packages.pip"]
aptPkgs = []

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "npm --prefix frontend ci"
]

[phases.build]
cmds = [
  "npm --prefix frontend run build",
  "mkdir -p staticfiles",
  "python3 manage.py collectstatic --noinput"
]

[start]
cmd = "python3 manage.py migrate --noinput && gunicorn spondon.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
